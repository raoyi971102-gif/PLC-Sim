# XUSE OPC UA 仿真服务器 配置
# ---------------------------------------------------------
# 覆盖各握手的默认耗时（单位 ms）。key 使用节点的 "base 前缀 + 通道号"
# 举例：
#   "机械臂_1"   → 覆盖 机械臂初始化_1 / 机械臂动作触发_1 等所有 base 为 '机械臂_1' 的握手
#   "工站"       → 覆盖 工站初始化
#   "加珠"       → 覆盖 加珠开始加工 / 加珠请求加工
#   "加样参数"   → 覆盖 加样参数下发 (注意 base 不含 '下发')
# ---------------------------------------------------------

delays:
  # Type-D 初始化：默认 600 ms，可改快或改慢
  工站: 400              # 工站整机初始化模拟耗时
  机械臂_1: 300
  机械臂_2: 300
  机械臂_3: 300
  马弗炉_1: 800          # 马弗炉初始化慢一些

  # Type-C 参数下发：默认 200 ms
  # 加样参数: 100

  # Type-A 编码触发：默认 1200 ms
  机械臂_1_action: 800   # 机械臂动作快一些 (仅示例，实际按 base 命名匹配)

  # Type-B 请求-应答：默认 1500 ms
  加珠: 1000
  加样: 2000
  开罐: 1200
