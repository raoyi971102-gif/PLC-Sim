# SZLab Poly Studio 握手仿真配置

# 默认动作延时。可按工位组或具体规则覆盖：
# robot, s04, s04:1 ... s04:6, s06, s07, s08, s09
# S04 实际接单后优先使用上位机写入的「磁搅时间设置」（毫秒）；
# 只有 Server 缺少该节点或节点值无法解析时才回退到下面的配置延时。
delay_ms: 120
poll_ms: 20

# 与 Uni-Lab-SZLab/scripts/szlab_workflow_handshake.py 对齐的工作流选项。
# workflow 可设为 all 或源握手器中的任一 WORKFLOW_ID；选择单个工作流时，
# 代理只初始化和轮询该工作流实际使用的节点。position 是 S04 调试位置（1-6）。
# pump=3 表示 1、2 号储液瓶均初始化为在位。
workflow: all
position: 1
pump: 1
s06_robot_workflow: true
s09_pipetting_workflow: true
s09_remaining_volume_ml: 100.0

# 正常停止代理时，只清理代理拥有的 PLC 输出；不会覆盖任务号、工艺选择等 PC 输入。
cleanup_on_exit: true

delays:
  robot: 180
  s04: 150
  s06: 120
  s07: 150
  s08: 150
  s09: 80

# 可在这里覆盖或补充 PLC -> 上位机的仿真初值，例如：
# initial_values:
#   S09天平读数稳定: true
#   S09天平读数: 12.34
initial_values: {}
