schema_version: 1
profile_id: unilab_robot_edge_example
description: Uni-Lab 机械臂 edge 设备包示例；生产动作只接受 Resource/Site 语义。
device_spec: device.yaml

default_device_binding:
  device_id: robot
  driver_key: unilab_robot_edge
  connection_ref: ROBOT_CONNECTION

resource_topology:
  resources:
    - {id: robot_cell, resource_type: workstation}
    - {id: robot, resource_type: robotic_arm}
    - {id: cell_controller, resource_type: device}

driver_config:
  macros:
    query_status: [{call: query_status}]
    pick: [{call: pick}]
    place: [{call: place}]
    get_command: [{call: get_command}]
    reconcile: [{call: reconcile}]
    request_controlled_stop: [{call: request_controlled_stop}]
    begin_commissioning: [{call: begin_commissioning}]
    move_to_point: [{call: move_to_point}]
    end_commissioning: [{call: end_commissioning}]
  interaction_catalog:
    package: unilab_robot_edge
    resource: config/interactions.example.yaml
  point_catalog:
    package: unilab_robot_edge
    resource: config/points.example.yaml
  journal_path: runtime/unilab_robot_edge_commands.sqlite3
  permit:
    required: true
    max_age_s: 0.5
    allowed_control_authority: [REMOTE_AUTO]
    allowed_safety_state: [NORMAL]
  commissioning:
    max_session_s: 1800
    max_offset_translation_mm: 5.0
    max_offset_rotation_deg: 2.0

workflow_importers:
  - {schema: unilab.python/v1, kind: workflow, codec: python_ast_v1}
