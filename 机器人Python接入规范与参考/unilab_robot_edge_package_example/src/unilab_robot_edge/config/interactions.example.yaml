    program_version: fairino-rack-place@1
    point_set_version: ptlc-cell@2026-07-31
    tool_profile: rack-gripper@1
    parameter_rules: {}
  staging-a/rack-site/pick:
    operation: pick
    mount_resource_id: staging-a
    site: rack-site
    allowed_resource_types: [rack, sample_rack]
    skill_id: rack.pick.staging
    program_version: fairino-rack-pick-staging@1
    point_set_version: ptlc-cell@2026-07-31
    tool_profile: rack-gripper@1
    parameter_rules: {}

  collector-warehouse/site-01/place:
