# CNB：main 被 GitHub Actions 同步过来后，部署到国内机 81.69.12.254
# 密钥在 private 仓 emoera/plc-sim-deploy-env（Web 密钥仓编辑易弄坏私钥换行）
main:
  push:
    - name: deploy-cn
      stages:
        - name: version
          script: |
            set -euo pipefail
            SHORT="$(echo "${CNB_COMMIT:-}" | cut -c1-7)"
            if [ -z "$SHORT" ] || [ "$SHORT" = "" ]; then
              SHORT="$(git rev-parse --short HEAD)"
            fi
            echo "$SHORT $(date -u '+%Y-%m-%d %H:%M UTC')" > OpcUaSim/VERSION
            cat OpcUaSim/VERSION

        - name: rsync-and-restart
          image: tencentcom/rsync
          imports:
            - https://cnb.cool/emoera/plc-sim-deploy-env/-/blob/main/deploy-cn.yml
          settings:
            user: $LOGIN_USER
            key: $PRIVATE_KEY
            hosts:
              - 81.69.12.254
            port: 22
            source: ./OpcUaSim/
            target: /www/wwwroot/OpcUaSim/
            recursive: true
            delete: true
            exclude:
              - .venv/
              - __pycache__/
              - .pytest_cache/
              - .DS_Store
              - "*.pyc"
              - .env
              - data/uploads/
              - extracted/
            # tencentcom/rsync 的 script 是「命令列表」，多行 | 块经常只跑到第一行就结束。
            # 整段放进 bash -lc，保证 pip/chown/restart/健康检查都会执行。
            script:
              - bash -lc 'set -euo pipefail
                cd /www/wwwroot/OpcUaSim
                .venv/bin/pip install -q -r requirements.txt
                mkdir -p data/uploads data/runtime
                chown -R www:www /www/wwwroot/OpcUaSim
                pkill -f "/www/wwwroot/OpcUaSim/server\\.py" || true
                pkill -f "/www/wwwroot/OpcUaSim/[a-z_]*handshake_agent\\.py" || true
                OLD_PID="$(systemctl show -p MainPID --value opcuasim-gui || true)"
                systemctl restart opcuasim-gui
                for _ in $(seq 30); do
                  sleep 1
                  NEW_PID="$(systemctl show -p MainPID --value opcuasim-gui || true)"
                  [ -n "$NEW_PID" ] && [ "$NEW_PID" != "0" ] && [ "$NEW_PID" != "$OLD_PID" ] || continue
                  if curl -fsS http://127.0.0.1:18765/api/health >/dev/null 2>&1; then
                    echo "GUI 已恢复 (pid $OLD_PID -> $NEW_PID)"
                    exit 0
                  fi
                done
                echo "GUI 未在 30 秒内恢复" >&2
                systemctl status opcuasim-gui --no-pager || true
                exit 1'
